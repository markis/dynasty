[build-system]
requires = ["hatchling>=1.24.0"]  # Pin to latest stable for reproducibility
build-backend = "hatchling.build"

[project]
name = "dynasty"
dynamic = ["version"]
description = "Dynasty Football"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["fantasy", "football", "sports", "analytics"]
authors = [{ name = "Markis Taylor", email = "m@rkis.net" }]
maintainers = [{ name = "Markis Taylor", email = "m@rkis.net" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "connectorx>=0.3.2",
  "gitpython>=3.1.40",
  "pandas>=2.2",
  "plotly>=5.21",
  "polars>=0.20",
  "psycopg2-binary>=2.9",
  "pydantic>=2.7",
  "pygithub>=2.3",
  "requests>=2.31",
  "scipy>=1.13",
  "sqlmodel>=0.0.18",
  "statsmodels>=0.14",
  "streamlit>=1.35",
  "tqdm>=4.66",
  "typing-extensions>=4.13.2",
]

[project.urls]
Documentation = "https://github.com/markis/dynasty#readme"
Issues = "https://github.com/markis/dynasty/issues"
Source = "https://github.com/markis/dynasty"

[tool.hatch.version]
path = "dynasty/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.10.0",
  "pytest>=8.2",
  "types-requests",
  "types-pyyaml",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:dynasty tests}"

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source_pkgs = ["dynasty", "tests"]
branch = true
parallel = true
omit = ["dynasty/__about__.py"]

[tool.coverage.paths]
dynasty = ["dynasty"]
tests = ["tests", "*/dynasty/tests"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "assert_never",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Use of `assert` for control flow
  "D203",   # Consistent whitespace in docstrings
  "D212",   # Multi-line docstring summary should start at the first line
  "E501",   # Line too long, ruff handles this with line-length
  "F401",   # Module level import not at top of file
  "TD002",  # TODO comments
  "TD003",  # TODO comments
  "FIX002", # TODO comments
]

[tool.ruff.lint.per-file-ignores]
"**/scripts/*" = ["INP001", "T201"]
"**/tests/**/*" = ["PLC1901", "PLR2004", "PLR6301", "S", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["dynasty"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
